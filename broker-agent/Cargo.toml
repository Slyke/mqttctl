[package]
name = "mqttctl-broker-agent"
version = "0.0.9"
edition = "2021"

[dependencies]
axum = { version = "0.8.9", features = ["json"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
nix = { version = "0.31.3", features = ["signal", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.53.2", features = ["fs", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
