# Base broker config for local compose.
# mqttctl edits this file directly through the raw broker config page.
log_dest stdout
allow_anonymous false
persistence true
persistence_location /mosquitto/data/
plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
per_listener_settings false
# Backup passwd file for non-DynSec fallback experiments.
# password_file /mosquitto/config/passwd

# Extra logging toggles:
# connection_messages true
# log_type all
# log_timestamp true

listener 1883

# TLS certs are not generated automatically by compose. Create them with
# docs/CERTS.md, expose port 8883 in compose, then uncomment this listener.
# listener 8883
# certfile /mosquitto/config/certs/mosquitto/tls.crt
# keyfile /mosquitto/config/certs/mosquitto/tls.key

listener 9001
protocol websockets
