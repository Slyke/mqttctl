services:
  mqttctl:
    build:
      context: .
      dockerfile: dockerfiles/mqttctl.dev.Dockerfile
    depends_on:
      - broker-agent
    working_dir: /workspace/mqttctl
    command:
      - /bin/bash
      - /workspace/dockerfiles/mqttctl.dev-entrypoint.sh
    environment:
      PORT: "3000"
      _DEV_ALLOWED_HOST: "mqttctl.domain.xyz"
      HOST: "0.0.0.0"
      ORIGIN: "https://mqttctl.domain.xyz"
      MQTTCTL_CONFIG_PATH: /workspace/config/compose/gui-api/mqttctl.config.json
      MQTTCTL_SECRETS_PATH: /workspace/config/compose/gui-api/mqttctl.secrets.json
      MQTTCTL_DB_KIND: sqlite
      MQTTCTL_SQLITE_PATH: /workspace/config/compose/gui-api/app-data/mqttctl.sqlite
      MQTTCTL_UI_OVERRIDE_CSS_PATH: /workspace/config/compose/gui-api/custom.css
      MQTTCTL_LOG_CONSOLE_FORMAT: text
    volumes:
      - .:/workspace
      - mqttctl-node-modules:/workspace/mqttctl/node_modules
    ports:
      - "3000:3000"

  broker-agent:
    build:
      context: .
      dockerfile: dockerfiles/broker-agent.dev.Dockerfile
    working_dir: /workspace/broker-agent
    command: cargo run
    environment:
      MQTTCTL_BROKER_AGENT_CONFIG_PATH: /workspace/config/compose/mqtt-agent/broker-agent.config.json
      MQTTCTL_LOG_CONSOLE_FORMAT: text
    volumes:
      - .:/workspace
      - broker-agent-target:/workspace/broker-agent/target
      - broker-agent-cargo:/usr/local/cargo/registry
      - ./config/compose/mqtt-agent:/mosquitto/config
      - ./config/compose/mqtt-agent/shared/data:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  proxy:
    image: nginx:1.27.4-alpine
    container_name: mqttctl-nginx-proxy
    ports:
      - "443:443"
    volumes:
      - ./config/nginx-dev-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx-dev-proxy/init-cert.sh:/init-cert.sh:ro
      - ./config/nginx-dev-proxy/certs:/certs
    environment:
      - DOMAIN=mqttctl.domain.xyz
    # entrypoint: ["/bin/sh", "-c", "/init-cert.sh && nginx -g 'daemon off;'"]
    command: []
    restart: unless-stopped
    depends_on:
      - mqttctl


volumes:
  mqttctl-node-modules:
  broker-agent-target:
  broker-agent-cargo:
