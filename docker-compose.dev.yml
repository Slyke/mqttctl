services:
  mqttctl:
    build:
      context: .
      dockerfile: dockerfiles/mqttctl.dev.Dockerfile
    restart: unless-stopped
    depends_on:
      broker-agent:
        condition: service_started
      mqttctl-mcp-keygen:
        condition: service_started
    working_dir: /workspace/mqttctl
    command:
      - /bin/bash
      - /workspace/dockerfiles/mqttctl.dev-entrypoint.sh
    environment:
      PORT: "3000"
      _DEV_ALLOWED_HOST: "mqttctl.domain.xyz"
      HOST: "0.0.0.0"
      ORIGIN: "https://mqttctl.domain.xyz"
      MQTTCTL_CONFIG_PATH: /workspace/config/compose/gui-api/mqttctl.config.json5
      MQTTCTL_SECRETS_PATH: /workspace/config/compose/gui-api/mqttctl.secrets.json5
      MQTTCTL_DB_KIND: sqlite
      MQTTCTL_SQLITE_PATH: /workspace/config/compose/gui-api/app-data/mqttctl.sqlite
      MQTTCTL_UI_OVERRIDE_CSS_PATH: /workspace/config/compose/gui-api/custom.css
      MQTTCTL_LOG_CONSOLE_FORMAT: text
      MQTTCTL_MCP_AUTH_ENABLED: "true"
      MQTTCTL_MCP_PUBLIC_KEY_PATH: /run/mqttctl-mcp-public/signing-public.pem
    volumes:
      - .:/workspace
      - mqttctl-node-modules:/workspace/mqttctl/node_modules
      - mqttctl-mcp-public:/run/mqttctl-mcp-public:ro
    ports:
      - "3000:3000"

  broker-agent:
    build:
      context: .
      dockerfile: dockerfiles/broker-agent.dev.Dockerfile
    working_dir: /workspace/broker-agent
    command: cargo run
    environment:
      MQTTCTL_BROKER_AGENT_CONFIG_PATH: /workspace/config/compose/mqtt-agent/broker-agent.config.json
      MQTTCTL_LOG_CONSOLE_FORMAT: text
    volumes:
      - .:/workspace
      - broker-agent-target:/workspace/broker-agent/target
      - broker-agent-cargo:/usr/local/cargo/registry
      - ./config/compose/mqtt-agent:/mosquitto/config
      - ./config/compose/mqtt-agent/shared/data:/mosquitto/data
    ports:
      - "1883:1883"
      - "9001:9001"

  proxy:
    image: nginx:1.27.4-alpine
    container_name: mqttctl-nginx-proxy
    ports:
      - "443:443"
    volumes:
      - ./config/nginx-dev-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/nginx-dev-proxy/init-cert.sh:/init-cert.sh:ro
      - ./config/nginx-dev-proxy/certs:/certs
    environment:
      - DOMAIN=mqttctl.domain.xyz
    # entrypoint: ["/bin/sh", "-c", "/init-cert.sh && nginx -g 'daemon off;'"]
    command: []
    restart: unless-stopped
    depends_on:
      - mqttctl

  mqttctl-mcp-keygen:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    user: "0:0"
    command: ["node", "scripts/generate-signing-keypair.mjs"]
    restart: "no"
    environment:
      MQTTCTL_MCP_PRIVATE_KEY_FILE: /run/mqttctl-mcp-private/signing-private.pem
      MQTTCTL_MCP_PUBLIC_KEY_FILE: /run/mqttctl-mcp-public/signing-public.pem
      MCP_KEY_OWNER_UID: "1000"
      MCP_KEY_OWNER_GID: "1000"
    volumes:
      - mqttctl-mcp-private:/run/mqttctl-mcp-private
      - mqttctl-mcp-public:/run/mqttctl-mcp-public

  mqttctl-mcp:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mqttctl-mcp-keygen:
        condition: service_completed_successfully
      mqttctl:
        condition: service_started
    environment:
      MQTTCTL_BASE_URL: http://mqttctl:3000
      MQTTCTL_MCP_PRIVATE_KEY_FILE: /run/mqttctl-mcp-private/signing-private.pem
      MQTTCTL_MCP_KEY_ID: compose
      MQTTCTL_MCP_AUDIENCE: mqttctl-api
      MCP_READ_BEARER_TOKENS:
      MCP_READWRITE_BEARER_TOKENS:
      HTTPS_ENABLED: "true"
      HTTP_ENABLED: "false"
      MCP_FAILURE_RESTART_DELAY_SECONDS: "60"
    volumes:
      - mqttctl-mcp-private:/run/mqttctl-mcp-private:ro
      - mqttctl-mcp-data:/app/data
    ports:
      - "3443:3443"
    healthcheck:
      test: ["CMD-SHELL", "curl --insecure --fail --silent https://localhost:3443/healthz >/dev/null && curl --insecure --fail --silent https://localhost:3443/readyz >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s


volumes:
  mqttctl-node-modules:
  broker-agent-target:
  broker-agent-cargo:
  mqttctl-mcp-private:
  mqttctl-mcp-public:
  mqttctl-mcp-data:
